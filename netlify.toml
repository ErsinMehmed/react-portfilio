[build]
  command = "npm run build"
  publish = "build"

# "Ask my CV" endpoint. The GROQ_API_KEY env var must be set in the Netlify
# site settings (and in a local .env for `netlify dev`); it is never bundled
# into the client. Reachable at /.netlify/functions/ask-cv.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Match CI and the npm-11 lockfile generator, so Netlify's `npm ci` reads the
# lockfile the same way and Vite has a supported Node runtime.
[build.environment]
  NODE_VERSION = "24"

# Private analytics dashboard. Must stay ABOVE the SPA catch-all: Netlify
# applies the first matching rule, so otherwise /stats would just serve the app.
# The rule covers POST as well as GET, which is what the sign-in form and the
# dashboard's action buttons post to.
#
# The function renders its own sign-in screen and checks STATS_USER /
# STATS_PASS (plain server-side env vars — no VITE_ prefix, so they are never
# bundled into the client), then keeps a signed session cookie. No
# WWW-Authenticate is ever sent, so the browser's own credential dialog never
# appears. Without a valid session the dashboard HTML is never produced at all.
#
# Optional: STATS_EXCLUDE_IPS, a comma-separated list of addresses whose visits
# are never recorded. The dashboard offers the same thing self-service.
[[redirects]]
  from = "/stats"
  to = "/.netlify/functions/stats"
  status = 200

# React Router is client-side; every deep link must fall back to index.html
# so refreshing /resume or /projects doesn't 404 on Netlify's CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived immutable caching for fingerprinted build output and the
# self-hosted fonts. Vite hashes every file in /assets, so a content change
# ships a new URL and can never be served stale; the /fonts files are stable
# subsets. index.html is intentionally left out (default short cache) so it
# always points at the current asset hashes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline hardening: no external scripts on this site, so a strict CSP costs
# nothing. The two static inline <script> tags in index.html (dark-mode flash
# guard + ResizeObserver error swallow) are allowlisted by hash instead of
# 'unsafe-inline' — recompute if either script's content ever changes.
# connect-src covers the Groq call made server-side by the function, not the
# browser, but is kept tight anyway for defense-in-depth.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-cUhZ6etdzUBeqaivfQlkMcBjsEXT7SEbdfcSin5qkO4=' 'sha256-vtWRx+K6GKlq/moueuXvE9QqaFkLN//y/OigmCtzPG8='; connect-src 'self'; font-src 'self'; frame-ancestors 'none'"
